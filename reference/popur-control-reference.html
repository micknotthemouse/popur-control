<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popur Litter Box Control</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee;
         margin:0; padding:24px; text-align:center; }
  h1 { font-size:28px; margin: 8px 0 16px; }
  .card { max-width:480px; margin:0 auto; }
  input[type=email], input[type=password] {
    display:block; width:100%; box-sizing:border-box; margin:10px auto;
    padding:16px; font-size:18px; border-radius:10px; border:1px solid #444;
    background:#1d1d1d; color:#eee; }
  label.remember { display:block; font-size:15px; color:#bbb; margin:6px 0 2px; }
  button { display:block; width:100%; margin:14px auto; padding:22px;
           font-size:24px; border:0; border-radius:14px; background:#2e7d32; color:#fff; }
  button.secondary { background:#455a64; font-size:20px; padding:16px; }
  button:active { opacity:.7; }
  #status { font-size:20px; line-height:1.7; margin:18px 0; }
  #msg, #loginError { min-height:26px; font-size:17px; color:#9ccc65; }
  #loginError { color:#ef9a9a; }
  .note { font-size:14px; color:#999; line-height:1.5; margin-top:18px; }
  select { width:100%; padding:14px; font-size:18px; border-radius:10px;
           background:#1d1d1d; color:#eee; border:1px solid #444; }
  .hidden { display:none; }
  #history { margin-top:30px; }
  #history h2 { font-size:21px; text-align:center; margin: 0 0 8px; }
  .chart { display:flex; align-items:flex-end; gap:3px; height:150px; margin:14px 0 2px; }
  .bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar { width:100%; max-width:26px; background:#2e7d32; border-radius:4px 4px 0 0; min-height:2px; }
  .bar.full { background:#c62828; }
  .bar.nodata { background:#2a2a2a; }
  .bar-val { font-size:11px; color:#ccc; margin-bottom:3px; }
  .bar-lab { font-size:10px; color:#999; margin-top:4px; white-space:nowrap; }
  #histStats { font-size:16px; line-height:1.6; text-align:center; }
  #histEvents { font-size:14px; color:#bbb; line-height:1.7; margin-top:10px; }
  button.linkish { display:inline-block; width:auto; margin:6px 4px; padding:8px 10px;
                   background:none; color:#9ccc65; font-size:15px; text-decoration:underline; }
</style>
</head>
<body>
<div class="card">

  <div id="loginView">
    <h1>&#128008; Popur Login</h1>
    <input type="email" id="email" placeholder="Popur account email" autocomplete="username">
    <input type="password" id="password" placeholder="Popur account password" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="remember"> Remember on this device</label>
    <button onclick="doLogin()">Log In</button>
    <div id="loginError"></div>
    <p class="note">Your password is hashed in this page and sent only to Popur's
    own cloud (cloud.popur.com.cn), exactly like the official app. Nothing goes
    anywhere else. Unless you check Remember, nothing is stored after you close
    this page.</p>
  </div>

  <div id="mainView" class="hidden">
    <h1>&#128008; <span id="deviceName">Litter Box</span></h1>
    <select id="deviceSelect" class="hidden" onchange="deviceChanged()"></select>
    <div id="status">Loading...</div>
    <button onclick="doClean()">Clean Now</button>
    <button class="secondary" onclick="doDnd(true)">Do Not Disturb: ON</button>
    <button class="secondary" onclick="doDnd(false)">Do Not Disturb: OFF</button>
    <button class="secondary" onclick="refreshStatus()">Refresh Status</button>
    <div id="msg"></div>
    <div id="history">
      <h2>Usage History</h2>
      <div id="histStats"></div>
      <div class="chart" id="histChart"></div>
      <div id="histEvents"></div>
      <p class="note" id="histNote"></p>
      <button class="linkish" id="sampleBtn" onclick="toggleSample()">Preview with sample data</button>
      <button class="linkish" onclick="clearHistory()">Clear history</button>
    </div>
    <button class="secondary" onclick="doLogout()">Log Out</button>
  </div>

</div>

<script>
"use strict";
var BASE = "https://cloud.popur.com.cn";

/* ---------------- MD5 (RFC 1321), constants derived per spec ---------------- */
function md5Bytes(input) {
  var S = [7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
           5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
           4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
           6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21];
  var K = [];
  for (var ki = 0; ki < 64; ki++) {
    K[ki] = Math.floor(Math.abs(Math.sin(ki + 1)) * 4294967296) | 0;
  }
  function rl(n, c) { return (n << c) | (n >>> (32 - c)); }

  var bytes = input.slice();
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  // 64-bit little-endian bit length (inputs here are far below 2^32 bits)
  for (var i = 0; i < 4; i++) bytes.push((bitLen >>> (8 * i)) & 0xff);
  bytes.push(0, 0, 0, 0);

  var a0 = 0x67452301 | 0, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476 | 0;
  for (var blk = 0; blk < bytes.length; blk += 64) {
    var x = [];
    for (var j = 0; j < 16; j++) {
      x[j] = bytes[blk + j * 4] | (bytes[blk + j * 4 + 1] << 8) |
             (bytes[blk + j * 4 + 2] << 16) | (bytes[blk + j * 4 + 3] << 24);
    }
    var a = a0, b = b0, c = c0, d = d0;
    for (var t = 0; t < 64; t++) {
      var round = t >> 4, f, g;
      if (round === 0)      { f = (b & c) | (~b & d); g = t; }
      else if (round === 1) { f = (d & b) | (~d & c); g = (5 * t + 1) % 16; }
      else if (round === 2) { f = b ^ c ^ d;          g = (3 * t + 5) % 16; }
      else                  { f = c ^ (b | ~d);       g = (7 * t) % 16; }
      var tmp = d;
      d = c;
      c = b;
      b = (b + rl((a + f + K[t] + x[g]) | 0, S[t])) | 0;
      a = tmp;
    }
    a0 = (a0 + a) | 0; b0 = (b0 + b) | 0; c0 = (c0 + c) | 0; d0 = (d0 + d) | 0;
  }
  function hex(n) {
    var s = "";
    for (var i = 0; i < 4; i++) s += ("0" + ((n >> (8 * i)) & 0xff).toString(16)).slice(-2);
    return s;
  }
  return hex(a0) + hex(b0) + hex(c0) + hex(d0);
}

function md5Hex(str) {
  var bytes = [];
  var utf8 = unescape(encodeURIComponent(str));
  for (var i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i) & 0xff);
  return md5Bytes(bytes);
}

/* ---------------- Minimal MQTT 3.1.1 over WebSocket (QoS 0 publish) ---------------- */
function encVarLen(n) {
  var b = [];
  do {
    var d = n % 128;
    n = Math.floor(n / 128);
    if (n > 0) d |= 0x80;
    b.push(d);
  } while (n > 0);
  return b;
}
function encStrBytes(s) {
  var bytes = [];
  var te = new TextEncoder().encode(s);
  bytes.push((te.length >> 8) & 0xff, te.length & 0xff);
  for (var i = 0; i < te.length; i++) bytes.push(te[i]);
  return bytes;
}
function connectPacket(clientId) {
  var body = encStrBytes("MQTT").concat([4, 0x02, 0, 60], encStrBytes(clientId));
  return new Uint8Array([0x10].concat(encVarLen(body.length), body));
}
function publishPacket(topic, payloadStr) {
  var te = new TextEncoder().encode(payloadStr);
  var body = encStrBytes(topic);
  for (var i = 0; i < te.length; i++) body.push(te[i]);
  return new Uint8Array([0x30].concat(encVarLen(body.length), body));
}
function mqttPublish(token, topic, payloadObj) {
  return new Promise(function (resolve, reject) {
    var url = "wss://cloud.popur.com.cn/mqtt?token=" + encodeURIComponent(token);
    var ws;
    try {
      ws = new WebSocket(url, "mqtt");
    } catch (e) { reject(e); return; }
    ws.binaryType = "arraybuffer";
    var clientId = "web" + Math.random().toString(16).slice(2, 12);
    var done = false;
    var timer = setTimeout(function () {
      if (!done) { done = true; try { ws.close(); } catch (e) {} reject(new Error("MQTT timed out")); }
    }, 12000);
    ws.onopen = function () { ws.send(connectPacket(clientId)); };
    ws.onmessage = function (ev) {
      var data = new Uint8Array(ev.data);
      if (data.length >= 2 && (data[0] & 0xf0) === 0x20) {  // CONNACK
        if (data[3] !== 0) {
          done = true; clearTimeout(timer);
          reject(new Error("MQTT connection refused, code " + data[3])); return;
        }
        ws.send(publishPacket(topic, JSON.stringify(payloadObj)));
        setTimeout(function () {
          if (!done) {
            done = true; clearTimeout(timer);
            try { ws.send(new Uint8Array([0xe0, 0x00])); ws.close(); } catch (e) {}
            resolve(true);
          }
        }, 700);
      }
    };
    ws.onerror = function () {
      if (!done) { done = true; clearTimeout(timer); reject(new Error("MQTT connection error")); }
    };
  });
}

/* ---------------- Popur cloud API ---------------- */
var state = { token: null, homeId: null, devices: [], deviceId: null };

function apiLogin(email, passwordHash) {
  return fetch(BASE + "/uapi/auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ param: email, password: passwordHash, type: "2" })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (data.code !== 200) throw new Error("Login failed (" + data.code + "): " + (data.msg || ""));
    state.token = data.data.token;
    state.homeId = data.data.user.defaulthomeid;
    return data;
  });
}
function apiDevices() {
  return fetch(BASE + "/uapi/home_details/" + state.homeId, {
    headers: { "Authorization": "Bearer " + state.token }
  }).then(function (r) { return r.json(); }).then(function (data) {
    state.devices = data.data.devicelist || [];
    return state.devices;
  });
}
function apiStatus(deviceId) {
  return fetch(BASE + "/uapi/deviceinfo/info/" + deviceId, {
    headers: { "Authorization": "Bearer " + state.token }
  }).then(function (r) { return r.json(); }).then(function (resp) {
    var d = resp.data || {};
    return {
      bin_full: d.rubbish === 2,
      cycles: d.worknum || 0,
      total_cycles: d.lastworknum || 0,
      manual_mode: String(d.manualmode) === "1",
      online: String(d.isonline) === "1"
    };
  });
}
function apiClean(deviceId) {
  return mqttPublish(state.token, "devcrpc/action/" + deviceId, {
    id: Math.floor(Date.now() / 1000), method: "action", from: "remote",
    params: { did: "0", sid: 2, aid: 1, in: [] }
  });
}
function apiSetManual(deviceId, on) {
  return mqttPublish(state.token, "devcrpc/attr/" + deviceId, {
    id: Math.floor(Date.now() / 1000), method: "set_properties", from: "remote",
    params: [{ did: "0", pid: 3, sid: 2, value: on ? 1 : 0 }]
  });
}

/* ---------------- UI ---------------- */
function $(id) { return document.getElementById(id); }

function doLogin() {
  var email = $("email").value.trim();
  var password = $("password").value;
  var err = $("loginError");
  err.textContent = "";
  if (!email || !password) { err.textContent = "Enter your email and password."; return; }
  err.textContent = "Logging in..."; err.style.color = "#9ccc65";
  apiLogin(email, md5Hex(password)).then(function () {
    if ($("remember").checked) {
      try {
        localStorage.setItem("popur_email", email);
        localStorage.setItem("popur_hash", md5Hex(password));
      } catch (e) {}
    }
    return apiDevices();
  }).then(function (devices) {
    if (!devices.length) { throw new Error("No litter boxes found on this account."); }
    var sel = $("deviceSelect");
    sel.innerHTML = "";
    devices.forEach(function (d) {
      var opt = document.createElement("option");
      opt.value = d.devid; opt.textContent = d.name || d.devid;
      sel.appendChild(opt);
    });
    sel.classList.toggle("hidden", devices.length < 2);
    state.deviceId = devices[0].devid;
    $("loginView").classList.add("hidden");
    $("mainView").classList.remove("hidden");
    refreshStatus();
  }).catch(function (e) {
    err.style.color = "#ef9a9a";
    err.textContent = e.message || String(e);
  });
}

function deviceChanged() {
  state.deviceId = $("deviceSelect").value;
  refreshStatus();
}

function currentDeviceName() {
  for (var i = 0; i < state.devices.length; i++) {
    if (state.devices[i].devid === state.deviceId) return state.devices[i].name || "Litter Box";
  }
  return "Litter Box";
}

function refreshStatus() {
  if (!state.deviceId) return;
  apiStatus(state.deviceId).then(function (s) {
    recordSnapshot(s);
    $("deviceName").textContent = currentDeviceName();
    $("status").innerHTML =
      (s.online ? "Online" : "&#128308; OFFLINE") + "<br>" +
      "Bin: " + (s.bin_full ? "<b>FULL, empty it</b>" : "ok") + "<br>" +
      "Cycles today: " + s.cycles + " &middot; Total: " + s.total_cycles + "<br>" +
      "Do Not Disturb: " + (s.manual_mode ? "ON" : "off");
  }).catch(function (e) {
    $("status").textContent = "Status error: " + (e.message || e);
  });
}

function setMsg(t) { $("msg").textContent = t; }

function doClean() {
  setMsg("Sending clean command...");
  apiClean(state.deviceId).then(function () {
    setMsg("Cleaning started.");
    setTimeout(refreshStatus, 2000);
  }).catch(function (e) { setMsg("Error: " + (e.message || e)); });
}

function doDnd(on) {
  setMsg("Sending...");
  apiSetManual(state.deviceId, on).then(function () {
    setMsg("Do Not Disturb " + (on ? "ON." : "OFF."));
    setTimeout(refreshStatus, 2000);
  }).catch(function (e) { setMsg("Error: " + (e.message || e)); });
}

function doLogout() {
  try { localStorage.removeItem("popur_email"); localStorage.removeItem("popur_hash"); } catch (e) {}
  location.reload();
}

/* ---------------- History: snapshots, daily usage, chart ---------------- */
var SAMPLE_MODE = false;

function dayKey(t) {
  var d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
function loadHistory() {
  try {
    var raw = localStorage.getItem("popur_history_" + state.deviceId);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveHistory(snaps) {
  try {
    localStorage.setItem("popur_history_" + state.deviceId, JSON.stringify(snaps.slice(-2000)));
  } catch (e) {}
}
function recordSnapshot(s) {
  if (!state.deviceId) return;
  var snaps = loadHistory();
  var snap = { t: Date.now(), cycles: s.cycles, total: s.total_cycles, bin: !!s.bin_full };
  var last = snaps[snaps.length - 1];
  if (last && (snap.t - last.t) < 10 * 60 * 1000 && last.cycles === snap.cycles && last.bin === snap.bin) {
    renderHistory();
    return;
  }
  snaps.push(snap);
  saveHistory(snaps);
  if (!SAMPLE_MODE) renderHistory();
}
function computeDailyUsage(snaps) {
  var byDay = {}, order = [], prev = null;
  snaps.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (s) {
    var d = dayKey(s.t);
    if (!(d in byDay)) { byDay[d] = 0; order.push(d); }
    var inc = 0;
    if (prev) {
      if (typeof s.total === "number" && typeof prev.total === "number" && s.total > prev.total) {
        inc = s.total - prev.total;
      } else if (s.cycles >= prev.cycles) {
        inc = s.cycles - prev.cycles;
      } else {
        inc = s.cycles;  // daily counter reset between snapshots
      }
      if (inc < 0 || inc > 200) inc = 0;
    }
    byDay[d] += inc;
    prev = s;
  });
  return order.map(function (d) { return { date: d, cycles: byDay[d] }; });
}
function detectBinEvents(snaps) {
  var evs = [], prev = null;
  snaps.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (s) {
    if (prev && s.bin !== prev.bin) evs.push({ t: s.t, type: s.bin ? "full" : "emptied" });
    prev = s;
  });
  return evs;
}
function sampleSnapshots() {
  var snaps = [], total = 1200, seed = 42;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (var day = 20; day >= 0; day--) {
    var perDay = 2 + Math.floor(rnd() * 6);
    var start = new Date(); start.setDate(start.getDate() - day); start.setHours(7, 0, 0, 0);
    var binDay = (day === 6 || day === 13);
    for (var k = 1; k <= perDay; k++) {
      total += 1;
      snaps.push({ t: start.getTime() + k * 2 * 3600 * 1000, cycles: k, total: total, bin: binDay && k === perDay });
    }
  }
  return snaps;
}
function renderHistory() {
  if (!state.deviceId && !SAMPLE_MODE) return;
  var snaps = SAMPLE_MODE ? sampleSnapshots() : loadHistory();
  var daily = computeDailyUsage(snaps);
  var map = {};
  daily.forEach(function (d) { map[d.date] = d.cycles; });
  var fullSet = {};
  snaps.forEach(function (s) { if (s.bin) fullSet[dayKey(s.t)] = true; });
  var firstDate = snaps.length ? dayKey(snaps[0].t) : null;
  var days = [], today = new Date(), i, dt, k;
  for (i = 13; i >= 0; i--) {
    dt = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    k = dayKey(dt.getTime());
    days.push({
      date: k, label: (dt.getMonth() + 1) + "/" + dt.getDate(),
      cycles: (k in map) ? map[k] : 0,
      nodata: firstDate ? (k < firstDate) : true,
      full: !!fullSet[k]
    });
  }
  var max = 1;
  days.forEach(function (d) { if (d.cycles > max) max = d.cycles; });
  $("histChart").innerHTML = days.map(function (d) {
    var h = d.nodata ? 4 : Math.max(3, Math.round(d.cycles / max * 110));
    var cls = d.nodata ? "bar nodata" : (d.full ? "bar full" : "bar");
    var val = (!d.nodata && d.cycles > 0) ? d.cycles : "";
    return '<div class="bar-wrap"><div class="bar-val">' + val + '</div>' +
           '<div class="' + cls + '" style="height:' + h + 'px"></div>' +
           '<div class="bar-lab">' + d.label + '</div></div>';
  }).join("");
  function sumRange(a, b) { var s = 0; for (var j = a; j < b; j++) s += days[j].cycles; return s; }
  var last7 = sumRange(7, 14), prev7 = sumRange(0, 7);
  var txt = "Avg " + (last7 / 7).toFixed(1) + " cycles/day, last 7 days (" + last7 + " total)";
  if (prev7 > 0) {
    var pct = Math.round((last7 - prev7) / prev7 * 100);
    txt += pct === 0 ? " &middot; flat vs prior week"
         : " &middot; " + (pct > 0 ? "&#9650; up " : "&#9660; down ") + Math.abs(pct) + "% vs prior week";
  }
  $("histStats").innerHTML = snaps.length ? txt : "";
  var evs = detectBinEvents(snaps).slice(-5).reverse();
  $("histEvents").innerHTML = evs.map(function (e) {
    var d = new Date(e.t);
    var when = d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return (e.type === "full" ? "&#128308; Bin full: " : "&#9989; Bin emptied: ") + when;
  }).join("<br>");
  if (SAMPLE_MODE) {
    $("histNote").textContent = "Showing sample data so you can see the layout. Your real history takes over as snapshots are recorded.";
  } else if (snaps.length) {
    $("histNote").textContent = snaps.length + " snapshots recorded since " +
      new Date(snaps[0].t).toLocaleDateString() +
      ". Estimates from your snapshots; history grows while this page is open and each time you visit. Red bars mark days the bin was seen full.";
  } else {
    $("histNote").textContent = "No history yet. A snapshot is saved each time this page checks status, so the chart fills in from here.";
  }
}
function toggleSample() {
  SAMPLE_MODE = !SAMPLE_MODE;
  $("sampleBtn").textContent = SAMPLE_MODE ? "Back to my data" : "Preview with sample data";
  renderHistory();
}
function clearHistory() {
  saveHistory([]);
  if (SAMPLE_MODE) toggleSample(); else renderHistory();
}

/* Try remembered login on load */
if (typeof window !== "undefined" && typeof document !== "undefined") {
  document.addEventListener("DOMContentLoaded", function () {
    var email, hash;
    try {
      email = localStorage.getItem("popur_email");
      hash = localStorage.getItem("popur_hash");
    } catch (e) {}
    if (email) $("email").value = email;
    if (email && hash) {
      $("loginError").textContent = "Logging in...";
      apiLogin(email, hash).then(function () { return apiDevices(); }).then(function (devices) {
        if (!devices.length) throw new Error("No devices found.");
        var sel = $("deviceSelect");
        devices.forEach(function (d) {
          var opt = document.createElement("option");
          opt.value = d.devid; opt.textContent = d.name || d.devid;
          sel.appendChild(opt);
        });
        sel.classList.toggle("hidden", devices.length < 2);
        state.deviceId = devices[0].devid;
        $("loginView").classList.add("hidden");
        $("mainView").classList.remove("hidden");
        refreshStatus();
      }).catch(function () {
        $("loginError").textContent = "";
      });
    }
    setInterval(function () {
      if (state.deviceId && !$("mainView").classList.contains("hidden")) refreshStatus();
    }, 30000);
  });
}
</script>
</body>
</html>
